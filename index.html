<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BombMan</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 6px;
    background: #121220;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    margin: 4px 0 6px;
    font-size: 22px;
    color: #ffd166;
    letter-spacing: 3px;
    text-shadow: 0 2px 8px rgba(255,209,102,0.4);
  }
  #hud {
    display: flex;
    gap: 12px;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: bold;
    flex-wrap: wrap;
    justify-content: center;
  }
  #hud span {
    background: #1e1e38;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #333355;
  }
  #canvas-container {
    position: relative;
    max-width: 100vw;
    display: flex;
    justify-content: center;
  }
  canvas {
    background: #000;
    border: 3px solid #3a3a5a;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    max-width: 96vw;
    height: auto;
    aspect-ratio: 600 / 520;
    display: block;
  }
  /* Mobile controls */
  #controls {
    display: none;
    width: 100%;
    max-width: 500px;
    margin-top: 10px;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
  }
  @media (pointer: coarse), (max-width: 768px) {
    #controls { display: flex; }
    #desktop-msg { display: none; }
  }
  /* Analog Joystick */
  #joystick-base {
    position: relative;
    width: 124px;
    height: 124px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(32,32,60,0.6) 100%);
    border: 2px solid rgba(255,255,255,0.22);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.4);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #joystick-base::before {
    content: "";
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 1px dashed rgba(255,255,255,0.15);
    pointer-events: none;
  }
  #joystick-knob {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4c74f5 0%, #203ea8 100%);
    border: 2px solid rgba(255,255,255,0.45);
    box-shadow: 0 4px 12px rgba(32,62,168,0.6);
    pointer-events: none;
    transform: translate(0px, 0px);
    transition: transform 0.15s ease-out;
  }
  /* Action buttons */
  #act-group {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  #btn-pause {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #2a2a44;
    border: 2px solid #555577;
    color: #ccc;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  #btn-pause:active {
    background: #3e3e60;
  }
  #btn-bomb {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff4d5a 20%, #b80018 100%);
    border: 3px solid #ffa3ab;
    box-shadow: 0 6px 18px rgba(230,57,70,0.55);
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #btn-bomb:active {
    transform: scale(0.92);
    box-shadow: 0 2px 8px rgba(230,57,70,0.7);
  }
  #desktop-msg {
    margin-top: 8px;
    font-size: 12px;
    color: #8888aa;
    text-align: center;
  }
</style>
</head>
<body>
<h1>BOMBMAN</h1>
<div id="hud">
  <span>Score: <span id="score">0</span></span>
  <span>Lives: <span id="lives">3</span></span>
  <span>Level: <span id="level">1</span></span>
  <span>Rivals: <span id="rivals">1</span></span>
</div>

<div id="canvas-container">
  <canvas id="game" width="600" height="520"></canvas>
</div>

<!-- Touch controls for mobile / iOS -->
<div id="controls">
  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>
  <div id="act-group">
    <div id="btn-pause">&#10074;&#10074;</div>
    <div id="btn-bomb">BOMB</div>
  </div>
</div>

<div id="desktop-msg">
  [Keyboard] Arrows / WASD to move &nbsp;|&nbsp; Space to drop bomb &nbsp;|&nbsp; P to pause &nbsp;|&nbsp; R to restart
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const T = 40, COLS = 15, ROWS = 13;
const scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives'),
      levelEl = document.getElementById('level'), rivalsEl = document.getElementById('rivals');

let map, player, rivals, monsters, bombs, explosions, score, lives, level, state, t = 0, banner = '', bannerT = 0;
let nextBombId = 1;
const KEY = {};

// Sound
let audioCtx = null;
function beep(freq, dur, type, vol) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.value = vol || 0.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

// Keyboard input
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (!KEY[k] && k === ' ' && state === 'play') tryPlaceBomb(player);
  if (k === 'p' && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
  if (k === 'r' && state === 'over') reset();
  KEY[k] = true;
});
window.addEventListener('keyup', e => { KEY[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in KEY) KEY[k] = false; });

// Touch / Analog Joystick Controls
const joyBase = document.getElementById('joystick-base');
const joyKnob = document.getElementById('joystick-knob');
let joystickTouchId = null;
let analogX = 0, analogY = 0;

function updateJoystick(clientX, clientY) {
  const rect = joyBase.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const rawDx = clientX - centerX;
  const rawDy = clientY - centerY;
  const dist = Math.hypot(rawDx, rawDy);
  const maxRadius = rect.width / 2 - 10;
  const deadzone = 7;

  if (dist < deadzone) {
    analogX = 0;
    analogY = 0;
    joyKnob.style.transform = 'translate(0px, 0px)';
  } else {
    const clampedDist = Math.min(dist, maxRadius);
    const knobX = (rawDx / dist) * clampedDist;
    const knobY = (rawDy / dist) * clampedDist;
    joyKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

    const intensity = (clampedDist - deadzone) / (maxRadius - deadzone);
    analogX = (rawDx / dist) * intensity;
    analogY = (rawDy / dist) * intensity;
  }
}

function resetJoystick() {
  joystickTouchId = null;
  analogX = 0;
  analogY = 0;
  joyKnob.style.transition = 'transform 0.15s ease-out';
  joyKnob.style.transform = 'translate(0px, 0px)';
}

joyBase.addEventListener('touchstart', e => {
  e.preventDefault();
  const touch = e.changedTouches[0];
  joystickTouchId = touch.identifier;
  joyKnob.style.transition = 'none';
  updateJoystick(touch.clientX, touch.clientY);
}, { passive: false });

window.addEventListener('touchmove', e => {
  if (joystickTouchId === null) return;
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickTouchId) {
      updateJoystick(touch.clientX, touch.clientY);
      break;
    }
  }
}, { passive: false });

window.addEventListener('touchend', e => {
  if (joystickTouchId === null) return;
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickTouchId) {
      resetJoystick();
      break;
    }
  }
});
window.addEventListener('touchcancel', () => { if (joystickTouchId !== null) resetJoystick(); });

// Mouse fallback for joystick on desktop testing
let mouseDraggingJoy = false;
joyBase.addEventListener('mousedown', e => {
  mouseDraggingJoy = true;
  joyKnob.style.transition = 'none';
  updateJoystick(e.clientX, e.clientY);
});
window.addEventListener('mousemove', e => {
  if (mouseDraggingJoy) updateJoystick(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => {
  if (mouseDraggingJoy) { mouseDraggingJoy = false; resetJoystick(); }
});

// Action buttons
const btnBomb = document.getElementById('btn-bomb');
const btnPause = document.getElementById('btn-pause');

btnBomb.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'play') tryPlaceBomb(player);
  else if (state === 'over') reset();
}, { passive: false });

btnPause.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'play' || state === 'pause') state = state === 'play' ? 'pause' : 'play';
}, { passive: false });

canvas.addEventListener('click', () => {
  if (state === 'over') reset();
});

// Map helpers
function tileAt(x, y) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return 1;
  return map[y][x];
}
function passable(x, y) { const t = tileAt(x, y); return t === 0 || t === 3; }
function bombAt(x, y) { return bombs.some(b => b.x === x && b.y === y); }
function fireAt(x, y) { return explosions.some(f => f.x === x && f.y === y); }
function destructiblesLeft() {
  let n = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (map[y][x] === 2) n++;
  return n;
}

// Solid check for an entity (supports walking off recently placed bomb)
function isSolid(tx, ty, ent) {
  if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return true;
  const m = map[ty][tx];
  if (m === 1 || m === 2) return true;
  for (const b of bombs) {
    if (b.x === tx && b.y === ty) {
      if (ent && ent.insideBombs && ent.insideBombs.has(b.id)) continue;
      return true;
    }
  }
  return false;
}

// Bounding box collision test (hitbox 26x26 inside 40x40 tile)
function canFit(px, py, ent) {
  const left = px + 7, right = px + T - 8;
  const top = py + 7, bottom = py + T - 8;
  const tx0 = Math.floor(left / T), tx1 = Math.floor(right / T);
  const ty0 = Math.floor(top / T), ty1 = Math.floor(bottom / T);
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      if (isSolid(tx, ty, ent)) return false;
    }
  }
  return true;
}

// Smooth Analog entity movement with corner sliding assist & clamping
function moveEntity(ent, vx, vy, speed, dt) {
  const mag = Math.hypot(vx, vy);
  let nx = vx, ny = vy;
  if (mag > 1) { nx /= mag; ny /= mag; }

  const stepX = Math.abs(nx) * speed * dt;
  const dirX = Math.sign(nx);
  const stepY = Math.abs(ny) * speed * dt;
  const dirY = Math.sign(ny);

  // Update insideBombs: once entity leaves the bomb tile, it becomes a solid obstacle
  if (ent.insideBombs && ent.insideBombs.size > 0) {
    const left = ent.x + 7, right = ent.x + T - 8;
    const top = ent.y + 7, bottom = ent.y + T - 8;
    for (const bId of Array.from(ent.insideBombs)) {
      const b = bombs.find(o => o.id === bId);
      if (!b) { ent.insideBombs.delete(bId); continue; }
      const bx0 = b.x * T, bx1 = bx0 + T, by0 = b.y * T, by1 = by0 + T;
      const overlaps = !(right < bx0 || left > bx1 || bottom < by0 || top > by1);
      if (!overlaps) ent.insideBombs.delete(bId);
    }
  }

  // Horizontal movement
  if (dirX !== 0 && stepX > 0) {
    const targetX = ent.x + dirX * stepX;
    if (canFit(targetX, ent.y, ent)) {
      ent.x = targetX;
    } else {
      // Corner assist: align Y to corridor center if moving horizontally
      if (Math.abs(nx) >= Math.abs(ny) * 0.7) {
        const centerTileY = Math.floor((ent.y + T / 2) / T) * T;
        const diffY = ent.y - centerTileY;
        if (Math.abs(diffY) > 0.5 && Math.abs(diffY) <= 15) {
          const nudgeY = ent.y - Math.sign(diffY) * Math.min(Math.abs(diffY), stepX * 0.9);
          if (canFit(ent.x, nudgeY, ent)) ent.y = nudgeY;
        }
      }
      let s = stepX;
      while (s >= 0.5) {
        if (canFit(ent.x + dirX * s, ent.y, ent)) { ent.x += dirX * s; break; }
        s *= 0.5;
      }
    }
  }

  // Vertical movement
  if (dirY !== 0 && stepY > 0) {
    const targetY = ent.y + dirY * stepY;
    if (canFit(ent.x, targetY, ent)) {
      ent.y = targetY;
    } else {
      // Corner assist: align X to corridor center if moving vertically
      if (Math.abs(ny) >= Math.abs(nx) * 0.7) {
        const centerTileX = Math.floor((ent.x + T / 2) / T) * T;
        const diffX = ent.x - centerTileX;
        if (Math.abs(diffX) > 0.5 && Math.abs(diffX) <= 15) {
          const nudgeX = ent.x - Math.sign(diffX) * Math.min(Math.abs(diffX), stepY * 0.9);
          if (canFit(nudgeX, ent.y, ent)) ent.x = nudgeX;
        }
      }
      let s = stepY;
      while (s >= 0.5) {
        if (canFit(ent.x, ent.y + dirY * s, ent)) { ent.y += dirY * s; break; }
        s *= 0.5;
      }
    }
  }
}

// Bomb dropping
function tryPlaceBomb(ent) {
  const tx = Math.floor((ent.x + T / 2) / T), ty = Math.floor((ent.y + T / 2) / T);
  const activeBombs = bombs.filter(b => b.owner === ent);
  if (activeBombs.length >= ent.maxBombs) return false;
  if (bombAt(tx, ty)) return false;

  const b = { id: nextBombId++, x: tx, y: ty, timer: 2.2, power: 2, owner: ent };
  bombs.push(b);
  if (!ent.insideBombs) ent.insideBombs = new Set();
  ent.insideBombs.add(b.id);
  beep(440, 0.08, 'square', 0.04);
  return true;
}

function addFire(x, y) {
  if (!fireAt(x, y)) explosions.push({ x, y, life: 0.45 });
}

function explode(b) {
  bombs = bombs.filter(o => o.id !== b.id);
  addFire(b.x, b.y);
  for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    for (let d = 1; d <= b.power; d++) {
      const tx = b.x + dx * d, ty = b.y + dy * d;
      const m = tileAt(tx, ty);
      if (m === 1) break; // Hard wall stops blast
      if (m === 2) { map[ty][tx] = 0; addFire(tx, ty); break; } // Brick destroyed
      const targetBomb = bombs.find(o => o.x === tx && o.y === ty);
      if (targetBomb) {
        addFire(tx, ty);
        targetBomb.timer = 0; // Chain explosion
        break;
      }
      addFire(tx, ty);
    }
  }
  beep(80, 0.3, 'sawtooth', 0.1);
}

// Danger map: which tiles are in the blast zone of any active bomb or fire
function getDangerMap() {
  const danger = {};
  for (const b of bombs) {
    danger[b.x + ',' + b.y] = true;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      for (let d = 1; d <= b.power; d++) {
        const tx = b.x + dx * d, ty = b.y + dy * d;
        if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) break;
        const m = map[ty][tx];
        if (m === 1) break;
        danger[tx + ',' + ty] = true;
        if (m === 2) break;
      }
    }
  }
  for (const f of explosions) danger[f.x + ',' + f.y] = true;
  return danger;
}

// BFS pathfinder
function findPath(sx, sy, isGoalFn, isPassableFn) {
  const startK = sx + ',' + sy;
  if (isGoalFn(sx, sy)) return [];
  const q = [[sx, sy]];
  const seen = new Set([startK]);
  const prev = {};
  while (q.length > 0) {
    const [x, y] = q.shift();
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
      if (seen.has(k)) continue;
      if (!isPassableFn(nx, ny)) continue;
      seen.add(k);
      prev[k] = [x, y];
      if (isGoalFn(nx, ny)) {
        const path = [];
        let curr = [nx, ny];
        while (curr[0] !== sx || curr[1] !== sy) {
          path.unshift({ x: curr[0], y: curr[1] });
          curr = prev[curr[0] + ',' + curr[1]];
        }
        return path;
      }
      q.push([nx, ny]);
    }
  }
  return null;
}

// Find safe escape tile away from active bomb blasts
function findSafeEscape(sx, sy, danger) {
  return findPath(
    sx, sy,
    (x, y) => !danger[x + ',' + y] && passable(x, y) && !bombAt(x, y),
    (nx, ny) => passable(nx, ny) && !bombAt(nx, ny)
  );
}

// Level generator
function genLevel(lv) {
  map = [];
  for (let y = 0; y < ROWS; y++) {
    const row = [];
    for (let x = 0; x < COLS; x++) {
      if (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1) row.push(1);
      else if (x % 2 === 0 && y % 2 === 0) row.push(1);
      else row.push(Math.random() < Math.min(0.24 + lv * 0.03, 0.45) ? 2 : 0);
    }
    map.push(row);
  }
  // Clear player corner (top-left)
  for (let y = 1; y <= 3; y++) for (let x = 1; x <= 3; x++) map[y][x] = 0;

  // Clear exit door (bottom-right)
  map[ROWS - 2][COLS - 2] = 3;
  map[ROWS - 2][COLS - 3] = 0;
  map[ROWS - 3][COLS - 2] = 0;

  // Clear rival spawn corners (top-right and bottom-left)
  map[1][COLS - 2] = 0; map[1][COLS - 3] = 0; map[2][COLS - 2] = 0;
  map[ROWS - 2][1] = 0; map[ROWS - 3][1] = 0; map[ROWS - 2][2] = 0;

  // Spawn Rival PC Bombers (competitive bots)
  const rivalCount = lv >= 3 ? 2 : 1;
  rivals = [];
  const rivalSpawns = [
    { x: (COLS - 2) * T, y: 1 * T },
    { x: 1 * T, y: (ROWS - 2) * T }
  ];
  for (let i = 0; i < rivalCount; i++) {
    const sp = rivalSpawns[i];
    rivals.push({
      id: 'rival_' + i,
      x: sp.x, y: sp.y,
      speed: 105 + Math.min(lv * 4, 25),
      dx: 0, dy: 0,
      maxBombs: 1,
      insideBombs: new Set(),
      bombCooldown: 1.5 + Math.random(),
      decisionTimer: 0,
      path: null,
      mode: 'hunt' // 'hunt' | 'flee' | 'clear'
    });
  }

  // Spawn monsters (red chasers)
  monsters = [];
  const monsterCount = Math.min(1 + lv, 4);
  let tries = 0;
  while (monsters.length < monsterCount && tries < 600) {
    tries++;
    const x = 3 + Math.floor(Math.random() * (COLS - 6));
    const y = 3 + Math.floor(Math.random() * (ROWS - 6));
    if (tileAt(x, y) !== 0) continue;
    monsters.push({
      x: x * T, y: y * T,
      speed: 70 + Math.min(lv * 5, 30),
      dx: 0, dy: 0,
      wobble: Math.random() * 6,
      target: null
    });
  }

  bombs = [];
  explosions = [];
}

function reset() {
  score = 0; lives = 3; level = 1;
  newLevel();
  state = 'play';
  updateHUD();
}

function newLevel() {
  genLevel(level);
  player = {
    x: T, y: T,
    speed: 125,
    dx: 0, dy: 0,
    maxBombs: 2,
    insideBombs: new Set()
  };
  banner = 'LEVEL ' + level;
  bannerT = 1.6;
}

// Player movement update with analog joystick support
function updatePlayer(dt) {
  let vx = 0, vy = 0;

  // Keyboard input (-1, 0, 1)
  if (KEY['arrowleft'] || KEY['a']) vx -= 1;
  if (KEY['arrowright'] || KEY['d']) vx += 1;
  if (KEY['arrowup'] || KEY['w']) vy -= 1;
  if (KEY['arrowdown'] || KEY['s']) vy += 1;

  // If analog joystick is active, it takes priority and gives continuous floats (-1.0 to 1.0)
  if (analogX !== 0 || analogY !== 0) {
    vx = analogX;
    vy = analogY;
  }

  player.dx = vx; player.dy = vy;
  moveEntity(player, vx, vy, player.speed, dt);
}

// Rival PC Bot AI: Competes to hunt player, blow up bricks, place bombs, and flee safely!
function updateRival(r, dt, danger) {
  r.bombCooldown -= dt;
  r.decisionTimer -= dt;

  const rx = Math.floor((r.x + T / 2) / T);
  const ry = Math.floor((r.y + T / 2) / T);
  const px = Math.floor((player.x + T / 2) / T);
  const py = Math.floor((player.y + T / 2) / T);
  const isThreatened = danger[rx + ',' + ry];

  // 1. SURVIVAL FIRST: If standing in danger zone, flee to safe tile immediately!
  if (isThreatened) {
    if (r.mode !== 'flee' || !r.path || r.path.length === 0 || r.decisionTimer <= 0) {
      r.mode = 'flee';
      r.decisionTimer = 0.25;
      r.path = findSafeEscape(rx, ry, danger);
    }
  } else {
    // 2. SAFE: Can attack or clear paths
    if (r.mode === 'flee') {
      r.mode = 'hunt';
      r.path = null;
    }

    // Check if rival should drop a bomb to attack player
    const distToPlayer = Math.abs(rx - px) + Math.abs(ry - py);
    const inlineWithPlayer = (rx === px && Math.abs(ry - py) <= 3) || (ry === py && Math.abs(rx - px) <= 3);

    if (r.bombCooldown <= 0 && (distToPlayer <= 2 || inlineWithPlayer)) {
      // Simulate placing a bomb: does a safe escape route exist?
      const simDanger = Object.assign({}, danger);
      simDanger[rx + ',' + ry] = true;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        for (let d = 1; d <= 2; d++) {
          const tx = rx + dx * d, ty = ry + dy * d;
          if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS || tileAt(tx, ty) === 1) break;
          simDanger[tx + ',' + ty] = true;
          if (tileAt(tx, ty) === 2) break;
        }
      }
      const escapePath = findSafeEscape(rx, ry, simDanger);
      if (escapePath && escapePath.length > 0) {
        tryPlaceBomb(r);
        r.bombCooldown = 2.5 + Math.random() * 1.5;
        r.mode = 'flee';
        r.path = escapePath;
        r.decisionTimer = 0.3;
      }
    }

    // Pathfinding towards player (or clearing blocking bricks)
    if (r.mode !== 'flee' && r.decisionTimer <= 0) {
      r.decisionTimer = 0.4;
      r.path = findPath(
        rx, ry,
        (x, y) => x === px && y === py,
        (nx, ny) => passable(nx, ny) && !bombAt(nx, ny) && !danger[nx + ',' + ny]
      );

      // If blocked by bricks, find path that can blow through bricks!
      if (!r.path) {
        const brickPath = findPath(
          rx, ry,
          (x, y) => x === px && y === py,
          (nx, ny) => tileAt(nx, ny) !== 1 && !bombAt(nx, ny) && !danger[nx + ',' + ny]
        );
        if (brickPath && brickPath.length > 0) {
          const nextStep = brickPath[0];
          if (tileAt(nextStep.x, nextStep.y) === 2 && r.bombCooldown <= 0) {
            const simDanger = Object.assign({}, danger);
            simDanger[rx + ',' + ry] = true;
            const escape = findSafeEscape(rx, ry, simDanger);
            if (escape && escape.length > 0) {
              tryPlaceBomb(r);
              r.bombCooldown = 3.0;
              r.mode = 'flee';
              r.path = escape;
            }
          } else if (passable(nextStep.x, nextStep.y)) {
            r.path = [nextStep];
          }
        }
      }
    }
  }

  // Follow planned path
  let dirX = 0, dirY = 0;
  if (r.path && r.path.length > 0) {
    const next = r.path[0];
    const targetCenterX = next.x * T + T / 2;
    const targetCenterY = next.y * T + T / 2;
    const curCenterX = r.x + T / 2;
    const curCenterY = r.y + T / 2;
    const diffX = targetCenterX - curCenterX;
    const diffY = targetCenterY - curCenterY;

    if (Math.hypot(diffX, diffY) < 4) {
      r.path.shift();
    } else {
      if (Math.abs(diffX) > Math.abs(diffY)) dirX = Math.sign(diffX);
      else dirY = Math.sign(diffY);
    }
  }

  r.dx = dirX; r.dy = dirY;
  moveEntity(r, dirX, dirY, r.speed, dt);
}

// Monster update (dumb chasers)
function updateMonster(m, dt) {
  if (m.target) {
    const tx = m.target.x, ty = m.target.y;
    if (!passable(tx, ty) || bombAt(tx, ty) || fireAt(tx, ty)) m.target = null;
  }
  if (!m.target) {
    const mx = Math.floor((m.x + T / 2) / T);
    const my = Math.floor((m.y + T / 2) / T);
    const px = Math.floor((player.x + T / 2) / T);
    const py = Math.floor((player.y + T / 2) / T);
    const opts = [[1,0],[-1,0],[0,1],[0,-1]].sort((a,b) => {
      const da = Math.hypot(mx + a[0] - px, my + a[1] - py);
      const db = Math.hypot(mx + b[0] - px, my + b[1] - py);
      return da - db + (Math.random() - 0.5) * 1.5;
    });
    for (const [dx, dy] of opts) {
      const nx = mx + dx, ny = my + dy;
      if (passable(nx, ny) && !bombAt(nx, ny) && !fireAt(nx, ny)) {
        m.target = { x: nx, y: ny };
        break;
      }
    }
    return;
  }
  const txp = m.target.x * T, typ = m.target.y * T;
  const dx = txp - m.x, dy = typ - m.y;
  const dist = Math.hypot(dx, dy);
  const step = m.speed * dt;
  if (dist <= step) { m.x = txp; m.y = typ; m.target = null; }
  else { m.x += dx / dist * step; m.y += dy / dist * step; }
}

function killPlayer() {
  lives--;
  beep(120, 0.4, 'sawtooth', 0.1);
  if (lives <= 0) state = 'over';
  else {
    player.x = T; player.y = T;
    player.insideBombs.clear();
    bombs = bombs.filter(b => !(b.x <= 2 && b.y <= 2));
  }
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  levelEl.textContent = level;
  rivalsEl.textContent = rivals ? rivals.length : 0;
}

function update(dt) {
  t += dt;
  updatePlayer(dt);

  const danger = getDangerMap();

  for (const r of rivals) updateRival(r, dt, danger);
  for (const m of monsters) updateMonster(m, dt);

  // Update bombs
  for (let i = bombs.length - 1; i >= 0; i--) {
    bombs[i].timer -= dt;
    if (bombs[i].timer <= 0) explode(bombs[i]);
  }

  // Update explosions
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].life -= dt;
    if (explosions[i].life <= 0) explosions.splice(i, 1);
  }

  // Check fire collision with player
  const ptx = Math.floor((player.x + T / 2) / T), pty = Math.floor((player.y + T / 2) / T);
  if (fireAt(ptx, pty)) killPlayer();

  // Check fire collision with rivals
  for (let i = rivals.length - 1; i >= 0; i--) {
    const rx = Math.floor((rivals[i].x + T / 2) / T);
    const ry = Math.floor((rivals[i].y + T / 2) / T);
    if (fireAt(rx, ry)) {
      rivals.splice(i, 1);
      score += 400; // Big bonus for defeating rival PC player
      beep(260, 0.25, 'triangle', 0.1);
    }
  }

  // Check fire collision with monsters
  for (let i = monsters.length - 1; i >= 0; i--) {
    const mx = Math.floor((monsters[i].x + T / 2) / T);
    const my = Math.floor((monsters[i].y + T / 2) / T);
    if (fireAt(mx, my)) {
      monsters.splice(i, 1);
      score += 150;
      beep(200, 0.15, 'square', 0.06);
    }
  }

  // Check monster touch player
  for (const m of monsters) {
    if (Math.abs(m.x - player.x) < T - 12 && Math.abs(m.y - player.y) < T - 12) {
      killPlayer();
      break;
    }
  }

  // Next level condition: all rivals defeated & exit door reached (or all bricks cleared)
  const exitReady = rivals.length === 0;
  if (state === 'play' && tileAt(ptx, pty) === 3 && exitReady) {
    level++;
    score += 1000;
    beep(660, 0.3, 'triangle', 0.1);
    newLevel();
  }

  if (bannerT > 0) bannerT -= dt;
  updateHUD();
}

// Rendering
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawWall(x, y) {
  const px = x * T, py = y * T;
  ctx.fillStyle = '#3f3f50'; ctx.fillRect(px, py, T, T);
  ctx.fillStyle = '#55556e'; ctx.fillRect(px + 3, py + 3, T - 6, T - 6);
  ctx.fillStyle = '#2d2d3a';
  ctx.fillRect(px + T - 6, py + 3, 3, T - 6);
  ctx.fillRect(px + 3, py + T - 6, T - 6, 3);
}

function drawBrick(x, y) {
  const px = x * T, py = y * T;
  ctx.fillStyle = '#a05a2c'; ctx.fillRect(px, py, T, T);
  ctx.strokeStyle = '#6f3818'; ctx.lineWidth = 2;
  ctx.strokeRect(px + 1, py + 1, T - 2, T - 2);
  ctx.beginPath();
  ctx.moveTo(px, py + T / 2); ctx.lineTo(px + T, py + T / 2);
  ctx.moveTo(px + T / 2, py); ctx.lineTo(px + T / 2, py + T / 2);
  ctx.moveTo(px + T / 4, py + T / 2); ctx.lineTo(px + T / 4, py + T);
  ctx.moveTo(px + 3 * T / 4, py + T / 2); ctx.lineTo(px + 3 * T / 4, py + T);
  ctx.stroke();
}

function drawExit(x, y, active) {
  const px = x * T, py = y * T;
  ctx.fillStyle = '#22301f'; ctx.fillRect(px, py, T, T);
  const pulse = active ? 0.6 + 0.35 * Math.sin(t * 6) : 0.2;
  ctx.fillStyle = 'rgba(80,220,120,' + pulse + ')';
  ctx.fillRect(px + 6, py + 4, T - 12, T - 8);
  ctx.fillStyle = '#141f12';
  ctx.fillRect(px + 6, py + 4, T - 12, 4);
}

function drawBomb(b) {
  const cx = b.x * T + T / 2, cy = b.y * T + T / 2;
  const isRival = b.owner !== player;
  const r = 13 + Math.sin(t * 18) * 1.5;

  if (isRival) {
    ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(cx, cy, r + 4, 0, Math.PI * 2); ctx.stroke();
  }

  ctx.fillStyle = isRival ? '#2b0914' : '#1a1a24';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(cx - 4, cy - 5, 4, 0, Math.PI * 2); ctx.fill();

  // Fuse
  ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.quadraticCurveTo(cx + 6, cy - r - 6, cx + 9, cy - r - 4); ctx.stroke();
  // Spark
  ctx.fillStyle = Math.sin(t * 30) > 0 ? '#fffa65' : '#ff3838';
  ctx.beginPath(); ctx.arc(cx + 9, cy - r - 4, 3, 0, Math.PI * 2); ctx.fill();
}

function drawFire(f) {
  const px = f.x * T, py = f.y * T;
  const a = Math.min(1, f.life / 0.45);
  ctx.fillStyle = 'rgba(255,100,0,' + a + ')';
  ctx.fillRect(px + 2, py + 2, T - 4, T - 4);
  ctx.fillStyle = 'rgba(255,220,70,' + a + ')';
  ctx.fillRect(px + 8, py + 8, T - 16, T - 16);
  ctx.fillStyle = 'rgba(255,255,255,' + a * 0.8 + ')';
  ctx.fillRect(px + 14, py + 14, T - 28, T - 28);
}

// Player (Blue Bomberman)
function drawPlayer() {
  const px = player.x + 4, py = player.y + 4, s = T - 8;
  ctx.fillStyle = '#2b7fff';
  roundRect(px, py, s, s, 8); ctx.fill();

  // Face visor
  ctx.fillStyle = '#ffdfba';
  roundRect(px + 4, py + 6, s - 8, s - 14, 5); ctx.fill();

  const ex = player.dx < 0 ? -3 : player.dx > 0 ? 3 : 0;
  const ey = player.dy < 0 ? -2 : player.dy > 0 ? 2 : 0;
  ctx.fillStyle = '#000';
  ctx.fillRect(px + s * 0.3 - 2 + ex, py + s * 0.38 + ey, 4, 6);
  ctx.fillRect(px + s * 0.7 - 2 + ex, py + s * 0.38 + ey, 4, 6);

  // Antenna pom-pom
  ctx.fillStyle = '#ff0055';
  ctx.beginPath(); ctx.arc(px + s / 2, py - 2, 4, 0, Math.PI * 2); ctx.fill();
}

// Rival PC Bot (Dark Shadow Bomberman)
function drawRival(r) {
  const px = r.x + 4, py = r.y + 4, s = T - 8;
  ctx.fillStyle = '#1c1c2e';
  roundRect(px, py, s, s, 8); ctx.fill();
  ctx.strokeStyle = '#e63946'; ctx.lineWidth = 2;
  roundRect(px, py, s, s, 8); ctx.stroke();

  // Visor
  ctx.fillStyle = '#280509';
  roundRect(px + 4, py + 6, s - 8, s - 14, 5); ctx.fill();

  // Glowing evil eyes
  const ex = r.dx < 0 ? -3 : r.dx > 0 ? 3 : 0;
  const ey = r.dy < 0 ? -2 : r.dy > 0 ? 2 : 0;
  ctx.fillStyle = '#ff2255';
  ctx.fillRect(px + s * 0.28 - 2 + ex, py + s * 0.4 + ey, 5, 4);
  ctx.fillRect(px + s * 0.72 - 3 + ex, py + s * 0.4 + ey, 5, 4);

  // Horns / antenna
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(px + s / 2, py - 2, 4, 0, Math.PI * 2); ctx.fill();
}

// Red monster
function drawMonster(m) {
  const wob = Math.sin(t * 8 + m.wobble) * 2;
  const px = m.x + 4, py = m.y + 4 + wob * 0.5, s = T - 8;
  ctx.fillStyle = '#e63946';
  roundRect(px, py, s, s, 10); ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.fillRect(px + s * 0.22, py + s * 0.28, 7, 7);
  ctx.fillRect(px + s * 0.62, py + s * 0.28, 7, 7);
  ctx.fillStyle = '#000';
  ctx.fillRect(px + s * 0.22 + 2, py + s * 0.28 + 2, 3, 3);
  ctx.fillRect(px + s * 0.62 + 2, py + s * 0.28 + 2, 3, 3);
}

function overlay(title, sub) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 36px monospace';
  ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
  ctx.fillStyle = '#fff';
  ctx.font = '15px monospace';
  ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 25);
}

function draw() {
  // Tile background
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      ctx.fillStyle = (x + y) % 2 ? '#d9c78f' : '#e6d6a3';
      ctx.fillRect(x * T, y * T, T, T);
    }
  }

  const exitReady = rivals.length === 0;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const m = map[y][x];
      if (m === 1) drawWall(x, y);
      else if (m === 2) drawBrick(x, y);
      else if (m === 3) drawExit(x, y, exitReady);
    }
  }

  for (const b of bombs) drawBomb(b);
  for (const f of explosions) drawFire(f);
  for (const m of monsters) drawMonster(m);
  for (const r of rivals) drawRival(r);
  drawPlayer();

  if (bannerT > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(canvas.width / 2 - 150, 36, 300, 44);
    ctx.fillStyle = '#ffd166';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(banner, canvas.width / 2, 65);
  }

  if (state === 'pause') overlay('PAUSED', 'Press P or Pause button to resume');
  if (state === 'over') overlay('GAME OVER', 'Tap screen or press R to restart');
}

let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(loop);
</script>
</body>
